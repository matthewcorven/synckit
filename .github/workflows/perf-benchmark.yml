# ci: revalidate workflow - touch
name: Perf Benchmark (fixed)

on:
  workflow_dispatch:
    inputs:
      server_type:
        description: 'Server type to benchmark (typescript | csharp)'
        required: false
        default: 'typescript'
  push:
    branches:
      - feature/11-dotnet-server
      - feature/11-dotnet-server-perf

jobs:
  diagnostics:
    name: Diagnostics + deps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnostics - collect environment info
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          uname -a > diagnostics/uname.txt || true
          lscpu > diagnostics/lscpu.txt || true
          free -h > diagnostics/free.txt || true
          df -h > diagnostics/df.txt || true
          cat /etc/os-release > diagnostics/os-release.txt || true
          echo "=== BUN (pre-setup) ===" > diagnostics/bun.txt
          bun -v >> diagnostics/bun.txt 2>&1 || true
          echo "=== node ===" > diagnostics/node.txt
          node -v >> diagnostics/node.txt 2>&1 || true
          echo "=== tests dir listing ===" > diagnostics/tests-ls.txt
          ls -la tests >> diagnostics/tests-ls.txt || true
          cat tests/package.json > diagnostics/tests-package.json || true
          env | sort > diagnostics/env.txt || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 'latest'

      - name: Verify Bun installation
        run: |
          echo "bun version:"; bun -v || true
          echo "which bun:"; which bun || true

      - name: Install test deps (capture logs + retry)
        run: |
          mkdir -p diagnostics
          echo "=== bun -v ===" > diagnostics/bun-install.log 2>&1
          bun -v >> diagnostics/bun-install.log 2>&1 || true
          echo "=== bun install (tests) ===" >> diagnostics/bun-install.log 2>&1

          # Retry bun install up to 3 times with exponential backoff
          attempt=1
          max=3
          while [ $attempt -le $max ]; do
            echo "Attempt #$attempt: $(date)" >> diagnostics/bun-install.log 2>&1
            if (cd tests && bun install) >> diagnostics/bun-install.log 2>&1; then
              echo "bun install succeeded on attempt #$attempt" >> diagnostics/bun-install.log 2>&1
              break
            fi
            echo "bun install failed on attempt #$attempt" >> diagnostics/bun-install.log 2>&1
            attempt=$((attempt+1))
            if [ $attempt -le $max ]; then
              sleep_seconds=$((attempt * 5))
              echo "Retrying in ${sleep_seconds}s..." >> diagnostics/bun-install.log 2>&1
              sleep ${sleep_seconds}
            fi
          done

          if [ $attempt -gt $max ]; then
            echo "bun install failed after ${max} attempts" >> diagnostics/bun-install.log 2>&1
            tail -n 200 diagnostics/bun-install.log || true
            exit 1
          fi

          tail -n 200 diagnostics/bun-install.log || true

      - name: Upload bun install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-install-logs
          path: diagnostics/bun-install.log

      - name: Print diagnostics files to job log (for debugging when artifacts fail)
        if: always()
        run: |
          echo "=== BUN INSTALL LOG (tail -200) ==="
          if [ -f diagnostics/bun-install.log ]; then
            tail -n 200 diagnostics/bun-install.log || true
          else
            echo "bun-install.log not present"
          fi

          echo "=== SMOKE CONNECTIONS LOG (tail -200) ==="
          if [ -f diagnostics/smoke-connections.log ]; then
            tail -n 200 diagnostics/smoke-connections.log || true
          else
            echo "smoke-connections.log not present"
          fi

      - name: Commit diagnostics to `ci/perf-diagnostics` branch (for retrieval)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=ci/perf-diagnostics
          echo "Preparing diagnostics commit for branch ${BRANCH}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin || true
          # Create or update branch
          if git ls-remote --exit-code --heads origin ${BRANCH}; then
            git checkout --track origin/${BRANCH}
          else
            git checkout -b ${BRANCH}
          fi

          mkdir -p ci-diagnostics
          if [ -d diagnostics ]; then
            cp -r diagnostics/* ci-diagnostics/ || true
          fi

          # Add a metadata file and the run id
          echo "run_id=${{ github.run_id }}" > ci-diagnostics/metadata.txt
          echo "sha=${{ github.sha }}" >> ci-diagnostics/metadata.txt

          git add ci-diagnostics || true
          if git diff --staged --quiet; then
            echo "No diagnostics changes to commit"
          else
            git commit -m "perf diagnostics: run ${{ github.run_id }} (${{ github.sha }})" || true
            git push origin HEAD:${BRANCH} --force
            echo "Pushed diagnostics to branch ${BRANCH}"
          fi

      - name: Upload diagnostics (final)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-diagnostics-final
          path: diagnostics/**

  smoke:
    name: Smoke test (push only)
    needs: diagnostics
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && needs.diagnostics.result == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Smoke test to start TS server and run quick connection discovery
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          echo "Starting TypeScript server (smoke mode)..."
          (cd server/typescript && PORT=8080 HOST=0.0.0.0 SYNCKIT_AUTH_REQUIRED=false bun src/index.ts) &
          echo $! > diagnostics/server.pid

          echo "Waiting for health..."
          for i in {1..30}; do
            if curl -s "http://localhost:8080/health" >/dev/null 2>&1; then
              echo "Server is healthy."; break
            fi
            sleep 1
            if [[ $i -eq 30 ]]; then
              echo "Server did not become healthy in time."; exit 1
            fi
          done

          echo "Running quick connection discovery (max 200)..."
          PERF_MAX_CONNECTIONS=200 SERVER_PORT=8080 SYNCKIT_SERVER_URL=http://localhost:8080 bun run perf/discover-max-connections.ts 2>&1 | tee diagnostics/smoke-connections.log || true

          echo "Killing server..."
          kill "$(cat diagnostics/server.pid)" >/dev/null 2>&1 || true

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: diagnostics/smoke-connections.log

  perf:
    name: Perf (manual dispatch only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 'latest'

      - name: Install test deps
        run: bun install
        working-directory: tests

      - name: Run perf benchmark (starts server + captures metrics)
        run: |
          bash run-perf-benchmark.sh ${{ github.event.inputs.server_type }}
        working-directory: tests
        env:
          SERVER_PORT: 8080
          PERF_MAX_CONNECTIONS: 5000

      - name: Upload perf results
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: tests/results/*.json

      - name: Upload updated SERVER_PERFORMANCE.md
        uses: actions/upload-artifact@v4
        with:
          name: server-performance-md
          path: docs/architecture/SERVER_PERFORMANCE.md

      - name: Show artifacts location
        run: echo "Artifacts uploaded - perf-results and server-performance-md"